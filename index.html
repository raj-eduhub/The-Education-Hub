<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a1120" />
    <!-- The stylesheet has always asked for Inter and nothing ever loaded it, so
         the application has been rendering in whatever the device defaults to.
         Weights 400-700 because the interface uses all of them. -->
    <!-- Stripe.js is always loaded from Stripe, never bundled or self-hosted:
         PCI DSS requires the payment form to come from Stripe's own origin.
         The dahlia build is the one that carries initCheckoutFormSdk(). -->
    <script src="https://js.stripe.com/dahlia/stripe.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two faces doing two jobs. Inter for the interface and body: the tallest
         x-height of the screen sans faces, so 13px labels and figures stay
         readable, with tabular numerals and letterform disambiguation. Plus
         Jakarta Sans for headings: warmer and more distinctive than Inter,
         which on its own reads as a dashboard rather than as somewhere a
         fourteen-year-old wants to spend an hour. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />
    <meta
      name="description"
      content="Y7to11.AI: every subject for Years 7 to 11, KS3 to GCSE, with Sonia, an AI tutor."
    />
    <title>Y7to11.AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
